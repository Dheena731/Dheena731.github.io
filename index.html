      rel="stylesheet"
    />

    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        try {
          var saved = localStorage.getItem('dt-theme');
          var dark = saved
            ? saved === 'crt'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('crt');
        } catch (e) {}
      })();
    </script>
